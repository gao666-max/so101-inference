# ============================================================
# color_thresholds.yaml —— 颜色 HSV 阈值配置
# ============================================================
# H（色相）: 0-179 (OpenCV 范围是 0-180)
# S（饱和度）: 0-255
# V（明度）: 0-255
#
# 调阈值方法：
#   1. 在摄像头画面中截一张包含目标物体的图
#   2. 用在线 HSV 调色器或 cv2.setTrackbar 交互调参
#   3. 把调好的值填进来
#
# 红色因为跨 HSV 0 度边界（0 = 180），需要两段区间

red:
  lower1: [0, 120, 70]
  upper1: [12, 255, 255]
  lower2: [165, 120, 70]
  upper2: [179, 255, 255]

yellow:
  lower1: [20, 100, 100]
  upper1: [35, 255, 255]

blue:
  lower1: [90, 50, 50]
  upper1: [130, 255, 255]

green:
  lower1: [40, 50, 50]
  upper1: [80, 255, 255]
